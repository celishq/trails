name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lints and tests the workspace, then installs the build with `install.sh` and finds `celis` from a new shell.
  cli:
    name: CLI and Linux install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Lint and test
        run: make verify
      - name: Build
        working-directory: crates
        run: cargo build -p celis
      - name: Serve the build as a release
        run: |
          set -eu
          case "$(uname -m)" in aarch64 | arm64) cpu=aarch64 ;; *) cpu=x86_64 ;; esac
          name="celis-$cpu-unknown-linux-musl.tar.gz"
          mkdir -p "$RUNNER_TEMP/release/latest/download" "$RUNNER_TEMP/home"
          tar -czf "$RUNNER_TEMP/release/latest/download/$name" -C crates/target/debug celis
          (cd "$RUNNER_TEMP/release/latest/download" && sha256sum "$name" > "$name.sha256")
      - name: Install, and find celis in a new shell
        run: |
          set -eu
          home="$RUNNER_TEMP/home"
          for run in 1 2; do
            env -i HOME="$home" PATH=/usr/bin:/bin SHELL=/bin/bash \
              CELIS_BASE="file://$RUNNER_TEMP/release" sh install.sh
          done
          env -i HOME="$home" PATH=/usr/bin:/bin bash -ic 'celis --version'
          env -i HOME="$home" PATH=/usr/bin:/bin sh -lc 'celis --version'
          test "$(grep -c '.local/bin' "$home/.bashrc")" = 1

  # Installs the plugin with the Codex and Gemini CLIs on fresh homes.
  plugins:
    name: Agent plugin install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the agent CLIs
        run: npm install -g @openai/codex@0.162.1 @google/gemini-cli@0.63.0
      - name: Codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          set -eu
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add celis@celis
          codex plugin list | grep -E 'celis@celis +installed, enabled'
      - name: Gemini CLI
        env:
          HOME: ${{ runner.temp }}/gemini
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          set -eu
          mkdir -p "$HOME"
          gemini extensions validate "$GITHUB_WORKSPACE"
          gemini extensions install "$GITHUB_WORKSPACE" --consent < /dev/null
          gemini extensions list 2>&1 | grep -F "celis ($(jq -r .version "$GITHUB_WORKSPACE/gemini-extension.json"))"

  # Prints the version a release PR would publish, empty for a PR that is no release.
  release-version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sh scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-builds:
    needs: release-version
    if: needs.release-version.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-version.outputs.version }}

  # Passes when the PR is no release, or when its release archives built.
  release:
    name: Release builds
    needs: [release-version, release-builds]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.release-version.result }}
          BUILDS: ${{ needs.release-builds.result }}
        run: |
          [ "$VERSION" = success ] || { echo "::error::Release version is $VERSION."; exit 1; }
          case "$BUILDS" in success | skipped) ;; *) echo "::error::Release builds are $BUILDS."; exit 1 ;; esac

  # Passes a PR into any branch but main, and a PR into main only when it is the release PR from this repo's dev.
  release-source:
    name: Release source
    needs: release-version
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}:${{ github.head_ref }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-version.outputs.version }}
        run: |
          [ "$BASE" = main ] || exit 0
          [ "$HEAD" = "$REPO:dev" ] || { echo "::error::Open this PR into dev. Only the release PR from dev goes into main."; exit 1; }
          [ -n "$VERSION" ] || { echo "::error::This PR has no new version. Run make release V=<version> on dev to open the release PR."; exit 1; }
