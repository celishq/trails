name: Release

# Publishes release `v<version>` when a merge to main carries a manifest version with no tag yet: its attested
# archives, `install.sh` and `install.md`. A last job installs the release on clean runners.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: namespace-profile-linux
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sh scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish to GitHub Releases
    needs: [version, build]
    runs-on: namespace-profile-linux
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* install.sh install.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes

  smoke:
    name: Install on ${{ matrix.runner }}
    needs: [version, publish]
    strategy:
      matrix:
        runner: [namespace-profile-linux, namespace-profile-mac]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install the published release
        env:
          CELIS_VERSION: ${{ needs.version.outputs.version }}
          CELIS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/v$CELIS_VERSION/install.sh" | sh
      - name: Start a trail and read it back
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          CELIS="$RUNNER_TEMP/bin/celis"
          "$CELIS" --version | grep -F "celis $VERSION"
          PROJECT="$RUNNER_TEMP/project"
          mkdir -p "$PROJECT" && cd "$PROJECT" && git init -q
          export CELIS_HOME="$RUNNER_TEMP/home"
          "$CELIS" step add -- "The release reads its trail back."
          "$CELIS" tree | tee "$RUNNER_TEMP/tree"
          grep -F 'The release reads its trail back.' "$RUNNER_TEMP/tree"
