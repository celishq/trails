name: Release

# Builds the `celis` command line for macOS and Linux, and puts every archive on the GitHub release of the
# tag. celis.ai/install.sh downloads them. A last job installs the release on clean runners.
#
# A GitHub release published on a `v1.2.3` tag gets the archives of version 1.2.3, which each build reads
# from `CELIS_VERSION`; the repo says 0.0.0. A manual run builds as 0.0.0, and publishes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The compiler the release builds with.
env:
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  version:
    name: Version
    runs-on: namespace-profile-linux
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          set -euo pipefail
          VERSION=0.0.0
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux builds
    runs-on: namespace-profile-linux
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # Zig is the C compiler and linker for both musl targets, so the bundled SQLite and `ring` build
      # without a cross toolchain, and the binaries run on any Linux.
      - name: Install cargo-zigbuild
        run: pip3 install --break-system-packages ziglang cargo-zigbuild
      - name: Build
        working-directory: crates
        env:
          CELIS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p celis --target "$target"
            mkdir -p "../dist"
            tar -czf "../dist/celis-$target.tar.gz" -C "target/$target/release" celis
          done
      - name: Checksums
        working-directory: dist
        run: for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: dist/

  mac:
    name: macOS builds
    runs-on: namespace-profile-mac
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build
        working-directory: crates
        env:
          CELIS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p celis --target "$target"
            tar -czf "../dist/celis-$target.tar.gz" -C "target/$target/release" celis
          done
      - name: Checksums
        working-directory: dist
        run: for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: cli-mac
          path: dist/

  publish:
    name: Publish to GitHub Releases
    if: github.ref_type == 'tag'
    runs-on: namespace-profile-linux
    needs: [version, linux, mac]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber

  smoke:
    name: Install on ${{ matrix.runner }}
    needs: [version, publish]
    strategy:
      matrix:
        runner: [namespace-profile-linux, namespace-profile-mac]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install the published release
        env:
          CELIS_VERSION: ${{ needs.version.outputs.version }}
          CELIS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: curl -fsSL https://celis.ai/install.sh | sh
      - name: Start a trail and read it back
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          CELIS="$RUNNER_TEMP/bin/celis"
          "$CELIS" --version | grep -F "celis $VERSION"
          PROJECT="$RUNNER_TEMP/project"
          mkdir -p "$PROJECT" && cd "$PROJECT" && git init -q
          export CELIS_HOME="$RUNNER_TEMP/home"
          "$CELIS" step add -- "The release reads its trail back."
          "$CELIS" read | tee "$RUNNER_TEMP/read"
          grep -F 'The release reads its trail back.' "$RUNNER_TEMP/read"
