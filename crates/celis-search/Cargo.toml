[package]
name = "celis-search"
version = "0.1.0"
edition = "2021"

[lib]
name = "celis_search"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
