[package]
name = "celis"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "celis"
path = "src/main.rs"

[dependencies]
celis-trails = { path = "../celis-trails" }
celis-nostr = { path = "../celis-nostr" }
anyhow = "1"
