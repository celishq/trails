[package]
name = "celis"
version = "0.1.0"
edition = "2021"
default-run = "celis"

[[bin]]
name = "celis"
path = "src/main.rs"

[lib]
name = "celis"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
anyhow = "1"
toml = "0.8"
ureq = "2"
dotenvy = "0.15"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
