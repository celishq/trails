[package]
name = "celis"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "celis"
path = "src/main.rs"

[dependencies]
celis-trails = { path = "../celis-trails" }
celis-nostr = { path = "../celis-nostr" }
anyhow = "1"
libc = "0.2"
notify = "8.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
unicode-width = "0.2"

[dev-dependencies]
celis-trails = { path = "../celis-trails" }
celis-nostr = { path = "../celis-nostr" }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
