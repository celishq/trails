[package]
name = "celis-store"
version = "0.1.0"
edition = "2021"

[lib]
name = "celis_store"
path = "src/lib.rs"

[dependencies]
celis-nostr = { path = "../celis-nostr" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"
