[package]
name = "celis-nostr"
version = "0.1.0"
edition = "2021"

[lib]
name = "celis_nostr"
path = "src/lib.rs"

[dependencies]
k256 = { version = "0.13", features = ["schnorr", "ecdh"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
chacha20 = "0.9"
data-encoding = "2"
bech32 = "0.11"
bip39 = { version = "2", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
getrandom = "0.2"

[dev-dependencies]
serde_json = "1"
